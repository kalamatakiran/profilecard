<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .root{
            width: 100%;
            height: 100vh;
            background-color:rgb(31, 165, 159) ;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sec{
            width: 300px;
            height: 400px;
            background-color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content:center;
            flex-direction: column;
            
        }
        .img1{
            width: 140px;
            height: 140px;
            border-radius: 100px;
            margin-top: -25px;
            border: 5px solid rgb(31, 165, 159);
            
        }
        .images img{
         width: 50px;
        height: 50px;
        border-radius: 100px; 

        background-color: rgb(31, 165, 159) 
        }
        .kiran{
            font-size: 20px;
            font-weight: 600;
            margin-top: 10px;
        }
        .user{
            font-size: 20px;
            text-align: center;
            margin: 5px 30px 19px 30px;
        }
        .images{
            display: flex;
            gap:10px;
        }
        
    </style>
</head>
<body>
    <div class="root">
        <div class="sec">
            <img src="images/kiran.jpeg" alt="" class="img1">
            <span class="kiran">Kiran Kalamata</span>
            <span class="user">User interface desiner and front-end developer</span>
            <div class="images">
                <a href="www.linkedin.com/in/kirankalamata"><img src="images/linkedin1.png" alt=""></a>
                <a href="https://www.naukri.com/mnjuser/profile"><img src="images/naukri-favicon-64.png" alt=""></a>
                <a href="https://www.instagram.com/kalamatakiran/"><img src="images/insta1.png" alt=""></a>
                <a href=""><img src="images/youtube1.png" alt=""></a>
            </div>
        </div>
    </div>
</body>
</html>
